[package]
name = "mini-swe-agent"
version = "0.1.0"
edition = "2021"
description = "A high-performance Rust implementation of mini-SWE-agent"
license = "MIT"
repository = "https://github.com/SWE-agent/mini-swe-agent"

[lib]
name = "mini_swe_agent"
path = "src/lib.rs"

[[bin]]
name = "mini"
path = "src/bin/mini.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"
dotenvy = "0.15"
llm-connector = "=1.4.0"
minijinja = { version = "2.24", features = ["json"] }
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shlex = "1.3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
tokio-test = "0.4"


